<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="main-header" class="scrolled"></header>

    <script src="js/main.js"></script>

    <main>
        <section class="page-header">
            <h1>Gallery</h1>
        </section>

        <section class="gallery-category">
            <h2>Front & Entry</h2>
            <div class="gallery-grid">
                <img src="media/Ostel%20(1).png" alt="Front of Property and Entry">
                <img src="media/Ostel%20(2).png" alt="Flowers in the Front Yard">
                <img src="media/Ostel%20(5).jpg" alt="Guest Book for Events">
            </div>
        </section>

        <section class="gallery-category">
            <h2>Living & Kitchen</h2>
            <div class="gallery-grid">
                <img src="media/Ostel%20(3).jpg" alt="Livingroom">
                <img src="media/Ostel%20(2).jpg" alt="Livingroom Space">
                <img src="media/Ostel%20(32).png" alt="Livingroom Couch">
                <img src="media/Ostel%20(42).png" alt="Livingroom Couch">
                <img src="media/Ostel%20(38).png" alt="Livingroom Sitting Place By Fireplace">
                <img src="media/Ostel%20(19).png" alt="Living Area Table">
                <img src="media/Ostel%20(43).png" alt="Dining Room Area">
                <img src="media/Ostel%20(60).png" alt="Living Room Decor">
                <img src="media/Ostel%20(57).png" alt="Livingroom Decor">
                <img src="media/Ostel%20(35).png" alt="Kitchen">
                <img src="media/Ostel%20(40).png" alt="Kitchen Dining Area">
                <img src="media/Ostel%20(29).png" alt="Kitchen Overlooking Backyard">
                <img src="media/Ostel%20(59).png" alt="Kitchen Events">
                <img src="media/Ostel%20(30).png" alt="Flower Centerpiece">
            </div>
        </section>

        <section class="gallery-category">
            <h2>Bedrooms & Bathrooms</h2>
            <div class="gallery-grid">
                <img src="media/Ostel%20(1).jpg" alt="Bedroom">
                <img src="media/Ostel%20(18).png" alt="Bedroom, view of bed.">
                <img src="media/Ostel%20(36).png" alt="Bedroom">
                <img src="media/Ostel%20(39).png" alt="Extra Bedroom">
                <img src="media/Ostel%20(41).png" alt="Second Bedroom">
                <img src="media/Ostel%20(55).png" alt="Trundle Bed in Extra Bedroom">
                <img src="media/Ostel%20(58).png" alt="Decorative Plates in Second Bedroom">
                <img src="media/Ostel%20(44).png" alt="Fancy Toilet">
                <img src="media/Ostel%20(26).png" alt="Bathroom">
                <img src="media/Ostel%20(28).png" alt="Poolside Bathroom">
                <img src="media/Ostel%20(23).png" alt="Towel Warmer">
                <img src="media/Ostel%20(21).png" alt="Washer and Dryer">
            </div>
        </section>

        <section class="gallery-category">
            <h2>Cinema Room</h2>
            <div class="gallery-grid">
                <img src="media/Ostel%20(6).jpg" alt="Cinema Room Activities">
                <img src="media/Ostel%20(37).png" alt="Cinima Screen">
                <img src="media/Ostel%20(61).png" alt="Cinima Seats and Screen">
                <img src="media/Ostel%20(62).png" alt="Cinima Screen">
                <img src="media/Ostel%20(4).jpg" alt="Cinima Popcorn Machine">
            </div>
        </section>

        <section class="gallery-category">
            <h2>Pool & Patio</h2>
            <div class="gallery-grid">
                <img src="media/Ostel%20(11).png" alt="Pool with beach entry.">
                <img src="media/Ostel%20(14).png" alt="Backyard Pool">
                <img src="media/Ostel%20(4).png" alt="Pool and Backyard">
                <img src="media/Ostel%20(6).png" alt="Pool with Beach Entry">
                <img src="media/Ostel%20(47).png" alt="Pool and Backyard at Night">
                <img src="media/Ostel%20(48).png" alt="Pool and Backyard at Night">
                <img src="media/Ostel%20(49).png" alt="Pool and Backyard at Night">
                <img src="media/Ostel%20(50).png" alt="Outdoor Backyard at Night">
                <img src="media/Ostel%20(46).png" alt="Outside Patio at Night">
                <img src="media/Ostel%20(51).png" alt="Backyard Patio at Night">
                <img src="media/Ostel%20(52).png" alt="Backyard Space at Night">
                <img src="media/Ostel%20(45).png" alt="Outdoor Backyard Couch At Night">
                <img src="media/Ostel%20(54).png" alt="Outdoor Fireplace">
                <img src="media/Ostel%20(53).png" alt="Outdoor Fireplace">
            </div>
        </section>

        <section class="gallery-category">
            <h2>Outdoor Space & Nature</h2>
            <div class="gallery-grid">
                <img src="media/Ostel%20(22).png" alt="Backyard Space">
                <img src="media/Ostel%20(25).png" alt="Backyard Event Space">
                <img src="media/Ostel%20(3).png" alt="Outdoor Ariel Shot of Backyard">
                <img src="media/Ostel%20(8).png" alt="Outdoor Space">
                <img src="media/Ostel%20(12).png" alt="Nature">
                <img src="media/Ostel%20(10).png" alt="Outdoor Nature">
                <img src="media/Ostel%20(15).png" alt="Outdoor Nature">
                <img src="media/Ostel%20(13).png" alt="Nature on the Property">
                <img src="media/Ostel%20(17).png" alt="Nature and Flower">
                <img src="media/Ostel%20(9).png" alt="Outdoor Flowers">
                <img src="media/Ostel%20(7).png" alt="Leaves Outside Backyard">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Ostel Place. All Rights Reserved.</p>
    </footer>

</html>
